<svg xmlns="http://www.w3.org/2000/svg" width="950" height="480" viewBox="0 0 950 480">
  <defs>
    <!-- 배경 및 패널 테두리 네온 효과 -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- 텍스트 네온 효과 -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: #0d0d0d; }
    .panel { fill: #141110; stroke: #ff6a00; stroke-width: 1.5; }
    
    /* 텍스트 스타일 */
    .mono { font-family: 'Courier New', Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    .terminal-text { fill: #ffb880; font-size: 13px; }
    .highlight { fill: #ff6a00; font-weight: bold; }
    .ascii-art { fill: #ff6a00; font-size: 8px; letter-spacing: 1px; line-height: 8px; }
    
    .title { fill: #ffffff; font-size: 32px; font-weight: bold; }
    .subtitle { fill: #ff8c42; font-size: 18px; font-weight: 500; }
    .info-text { fill: #e0e0e0; font-size: 14px; }
    .link-text { fill: #ff8c42; text-decoration: underline; }
    
    .section-title { fill: #ffffff; font-size: 16px; font-weight: bold; }
    
    /* 스킬 뱃지 스타일 */
    .pill { fill: transparent; stroke: #ff8c42; stroke-width: 1; rx: 12; }
    .pill-text { fill: #ffb880; font-size: 11px; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- 전체 배경 -->
  <rect class="bg" width="950" height="480" />

  <!-- ================= 왼쪽 패널 (아바타) ================= -->
  <g transform="translate(20, 20)">
    <rect class="panel" width="310" height="440" rx="10" filter="url(#neon-glow)" />
    
    <circle cx="20" cy="20" r="6" fill="#ff5f56" />
    <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
    <circle cx="60" cy="20" r="6" fill="#27c93f" />
    <text x="155" y="24" class="mono terminal-text" text-anchor="middle" font-size="12px"> Hello World </text>
    
    <text x="20" y="55" class="mono terminal-text"><tspan class="highlight">✩‧₊˚(๑ ᐢ ᵕ ᐢ ๑)𝚈𝙾𝚄𝚁 𝚃𝙷𝙴 𝙱𝙴𝚂𝚃 ✩‧₊˚</tspan></text>
    
    <text x="155" y="80" class="mono ascii-art" text-anchor="middle" filter="url(#text-glow)">
      <tspan x="155" dy="1.2em">.::..::..::..::..::..::..::.</tspan>
    </text>
  </g>

  <!-- ================= 오른쪽 패널 (정보) ================= -->
  <g transform="translate(350, 20)">
    <rect class="panel" width="580" height="440" rx="10" filter="url(#neon-glow)" />
    
    <circle cx="20" cy="20" r="6" fill="#ff5f56" />
    <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
    <circle cx="60" cy="20" r="6" fill="#27c93f" />
    <text x="290" y="24" class="mono terminal-text" text-anchor="middle" font-size="12px">terminal</text>
    
    <text x="30" y="70" class="mono terminal-text">const greeting = "HI👋";</text>
    
    <text x="30" y="115" class="sans title" filter="url(#text-glow)">I'm Dahee Lee 🧡</text>
    
    <!-- 오류 수정: & 기호를 &amp; 로 변경 -->
    <text x="30" y="145" class="mono subtitle">HPC System Engineer &amp; Infrastructure Specialist</text>
    
    <line x1="30" y1="165" x2="550" y2="165" stroke="#332211" stroke-width="2" />
    
    <!-- 오류 수정: <br> 제거 및 좌표 활용한 줄바꿈 적용 -->
    <g transform="translate(30, 195)" class="sans info-text">
      <text y="0">📍 Location: South Korea </text>
      <text y="40">🌐 Summary: </text>
      <text y="65" class="link-text">A dedicated HPC System Engineer with strong expertise in cluster</text>
      <text y="85" class="link-text">management, parallel file systems, and high-speed networking.</text>
      <text y="105" class="link-text">I specialize in optimizing resource scheduling and resolving</text>
      <text y="125" class="link-text">complex infrastructure challenges for stable HPC environments.</text>
    </g>
    
    <text x="30" y="350" class="sans section-title">Skills &amp; Technologies</text>
    
    <!-- 직무에 맞춘 HPC 스택으로 뱃지 변경 및 사이즈 조절 -->
    <g transform="translate(30, 370)">
      <!-- Row 1 -->
      <rect class="pill" x="0" y="0" width="70" height="26" />
      <text class="sans pill-text" x="35" y="13">Linux</text>
      
      <rect class="pill" x="80" y="0" width="80" height="26" />
      <text class="sans pill-text" x="120" y="13">SLURM</text>
      
      <rect class="pill" x="170" y="0" width="100" height="26" />
      <text class="sans pill-text" x="220" y="13">InfiniBand</text>
      
      <rect class="pill" x="280" y="0" width="70" height="26" />
      <text class="sans pill-text" x="315" y="13">GPFS</text>
      
      <rect class="pill" x="360" y="0" width="80" height="26" />
      <text class="sans pill-text" x="400" y="13">Lustre</text>
      
      <!-- Row 2 -->
      <rect class="pill" x="0" y="36" width="120" height="26" />
      <text class="sans pill-text" x="60" y="49">Shell Scripting</text>
      
      <rect class="pill" x="130" y="36" width="90" height="26" />
      <text class="sans pill-text" x="175" y="49">Mellanox</text>
      
      <rect class="pill" x="230" y="36" width="70" height="26" />
      <text class="sans pill-text" x="265" y="49">MPI</text>
      
      <rect class="pill" x="310" y="36" width="110" height="26" />
      <text class="sans pill-text" x="365" y="49">Prometheus</text>
    </g>
  </g>
</svg>
