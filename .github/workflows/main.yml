name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 10

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: KRdahee
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff6a00&color_dots=#2A2422,#331a00,#803300,#cc5200,#ff6a00
            dist/github-snake.gif?color_snake=#ff6a00&color_dots=#2A2422,#331a00,#803300,#cc5200,#ff6a00

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
