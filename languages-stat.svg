<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
    <defs>
        <!-- 네온 효과 적용 -->
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <style>
        .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; }
        .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #ff8c42; }
        .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #a0a0a0; }
        .lang { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #ffb880; }
        .stat-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #FFFFFF; text-anchor: end; }
        .stat-size { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #a0a0a0; text-anchor: end; }
        
        .card-bg { fill: #141110; stroke: #ff6a00; stroke-width: 1.5; }
    </style>

    <!-- 와이드 카드 배경 -->
    <rect x="5" y="5" width="790" height="245" rx="10" class="card-bg" filter="url(#neon-glow)" />

    <!-- 제목 아이콘 및 텍스트 -->
    <g transform="translate(25, 22)">
        <path fill="#ff6a00" fill-rule="evenodd" d="M1.5 2.75a.25.25 0 01.25-.25h12.5a.25.25 0 01.25.25v8.5a.25.25 0 01-.25.25h-6.5a.75.75 0 00-.53.22L4.5 14.44v-2.19a.75.75 0 00-.75-.75h-2a.25.25 0 01-.25-.25v-8.5zM1.75 1A1.75 1.75 0 000 2.75v8.5C0 12.216.784 13 1.75 13H3v1.543a1.457 1.457 0 002.487 1.03L8.061 13h6.189A1.75 1.75 0 0016 11.25v-8.5A1.75 1.75 0 0014.25 1H1.75zm5.03 3.47a.75.75 0 010 1.06L5.31 7l1.47 1.47a.75.75 0 01-1.06 1.06l-2-2a.75.75 0 010-1.06l2-2a.75.75 0 011.06 0zm2.44 0a.75.75 0 000 1.06L10.69 7 9.22 8.47a.75.75 0 001.06 1.06l2-2a.75.75 0 000-1.06l-2-2a.75.75 0 00-1.06 0z"/>
    </g>
    <text x="50" y="36" class="title">Tech Stack &amp; Languages</text>

    <!-- 서브타이틀 및 설명 -->
    <text x="25" y="60" class="subtitle">Frequently used stack</text>
    <text x="25" y="78" class="desc">Overview of 10 primary languages and tools</text>

    <!-- 상단 프로그레스 바 -->
    <clipPath id="bar-clip">
        <rect x="25" y="92" width="750" height="8" rx="4" />
    </clipPath>
    <g clip-path="url(#bar-clip)">
        <rect x="25" y="92" width="750" height="8" fill="#222222" />
        <rect x="25" y="92" width="150" height="8" fill="#b07219" />
        <rect x="175" y="92" width="120" height="8" fill="#3572A5" />
        <rect x="295" y="92" width="100" height="8" fill="#f1e05a" />
        <rect x="395" y="92" width="90" height="8" fill="#3178c6" />
        <rect x="485" y="92" width="75" height="8" fill="#e34c26" />
        <rect x="560" y="92" width="65" height="8" fill="#00758f" />
        <rect x="625" y="92" width="55" height="8" fill="#f34b7d" />
        <rect x="680" y="92" width="40" height="8" fill="#6db33f" />
        <rect x="720" y="92" width="30" height="8" fill="#f05032" />
        <rect x="750" y="92" width="25" height="8" fill="#FCC624" />
    </g>

    <!-- 1번 줄 -->
    <circle cx="30" cy="125" r="4" fill="#b07219" />
    <text x="42" y="130" class="lang">Java</text>
    <text x="270" y="130" class="stat-value">Primary</text>
    <text x="375" y="130" class="stat-size">Backend</text>

    <circle cx="430" cy="125" r="4" fill="#3572A5" />
    <text x="442" y="130" class="lang">Python</text>
    <text x="670" y="130" class="stat-value">Active</text>
    <text x="775" y="130" class="stat-size">AI / Script</text>

    <!-- 2번 줄 -->
    <circle cx="30" cy="150" r="4" fill="#f1e05a" />
    <text x="42" y="155" class="lang">JavaScript</text>
    <text x="270" y="155" class="stat-value">Frontend</text>
    <text x="375" y="155" class="stat-size">Web</text>

    <circle cx="430" cy="150" r="4" fill="#3178c6" />
    <text x="442" y="155" class="lang">TypeScript</text>
    <text x="670" y="155" class="stat-value">Typed</text>
    <text x="775" y="155" class="stat-size">Web</text>

    <!-- 3번 줄 -->
    <circle cx="30" cy="175" r="4" fill="#e34c26" />
    <text x="42" y="180" class="lang">HTML / CSS</text>
    <text x="270" y="180" class="stat-value">Markup</text>
    <text x="375" y="180" class="stat-size">UI</text>

    <circle cx="430" cy="175" r="4" fill="#00758f" />
    <text x="442" y="180" class="lang">SQL</text>
    <text x="670" y="180" class="stat-value">Database</text>
    <text x="775" y="180" class="stat-size">Query</text>

    <!-- 4번 줄 -->
    <circle cx="30" cy="200" r="4" fill="#f34b7d" />
    <text x="42" y="205" class="lang">C++</text>
    <text x="270" y="205" class="stat-value">Systems</text>
    <text x="375" y="205" class="stat-size">Algorithm</text>

    <circle cx="430" cy="200" r="4" fill="#6db33f" />
    <text x="442" y="205" class="lang">Spring Framework</text>
    <text x="670" y="205" class="stat-value">Framework</text>
    <text x="775" y="205" class="stat-size">Enterprise</text>

    <!-- 5번 줄 -->
    <circle cx="30" cy="225" r="4" fill="#f05032" />
    <text x="42" y="230" class="lang">Git</text>
    <text x="270" y="230" class="stat-value">VCS</text>
    <text x="375" y="230" class="stat-size">Tracking</text>

    <circle cx="430" cy="225" r="4" fill="#FCC624" />
    <text x="442" y="230" class="lang">Linux</text>
    <text x="670" y="230" class="stat-value">OS</text>
    <text x="775" y="230" class="stat-size">Environment</text>
</svg>
