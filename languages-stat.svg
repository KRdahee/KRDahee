<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160">
    <style>
        .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #0366d6; }
        .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #0366d6; }
        .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #666; }
        .lang { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #586069; }
        .stat-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #586069; text-anchor: end; }
        .stat-size { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #666; text-anchor: end; }
        .card-bg { fill: #ffffff; stroke: #e1e4e8; stroke-width: 1; rx: 6px; }
    </style>

    <!-- 카드 배경 (깔끔하게 보이기 위해 테두리 추가) -->
    <rect x="0" y="0" width="100%" height="100%" class="card-bg" />

    <!-- 제목 아이콘 및 텍스트 -->
    <g transform="translate(15, 17)">
        <path fill="#0366d6" fill-rule="evenodd" d="M1.5 2.75a.25.25 0 01.25-.25h12.5a.25.25 0 01.25.25v8.5a.25.25 0 01-.25.25h-6.5a.75.75 0 00-.53.22L4.5 14.44v-2.19a.75.75 0 00-.75-.75h-2a.25.25 0 01-.25-.25v-8.5zM1.75 1A1.75 1.75 0 000 2.75v8.5C0 12.216.784 13 1.75 13H3v1.543a1.457 1.457 0 002.487 1.03L8.061 13h6.189A1.75 1.75 0 0016 11.25v-8.5A1.75 1.75 0 0014.25 1H1.75zm5.03 3.47a.75.75 0 010 1.06L5.31 7l1.47 1.47a.75.75 0 01-1.06 1.06l-2-2a.75.75 0 010-1.06l2-2a.75.75 0 011.06 0zm2.44 0a.75.75 0 000 1.06L10.69 7 9.22 8.47a.75.75 0 001.06 1.06l2-2a.75.75 0 000-1.06l-2-2a.75.75 0 00-1.06 0z"/>
    </g>
    <text x="38" y="30" class="title">16 Languages</text>

    <!-- 서브타이틀 및 설명 -->
    <text x="15" y="55" class="subtitle">Most used languages</text>
    <text x="15" y="73" class="desc">estimation from 370kb of code in 279 edited files across 86 commits</text>

    <!-- 언어 비율 프로그레스 바 (모서리 둥글게 처리) -->
    <clipPath id="bar-clip">
        <rect x="15" y="85" width="450" height="8" rx="4" />
    </clipPath>
    <g clip-path="url(#bar-clip)">
        <!-- 배경 -->
        <rect x="15" y="85" width="450" height="8" fill="#d1d5da" />
        <!-- TypeScript (대부분의 비중) -->
        <rect x="15" y="85" width="422" height="8" fill="#3178c6" />
        <!-- Rust -->
        <rect x="437" y="85" width="18" height="8" fill="#ededed" />
        <!-- Go -->
        <rect x="455" y="85" width="8" height="8" fill="#ededed" />
        <!-- JavaScript -->
        <rect x="463" y="85" width="2" height="8" fill="#ededed" />
    </g>

    <!-- 흰색(#ededed) 바깥 구분선 (배경에 묻히지 않게 하기 위함) -->
    <rect x="437" y="85" width="18" height="8" fill="none" stroke="#d1d5da" stroke-width="0.5" clip-path="url(#bar-clip)"/>
    <rect x="455" y="85" width="8" height="8" fill="none" stroke="#d1d5da" stroke-width="0.5" clip-path="url(#bar-clip)"/>

    <!-- 첫 번째 줄 (TypeScript & Go) -->
    <circle cx="20" cy="113" r="4" fill="#3178c6" />
    <text x="32" y="118" class="lang">TypeScript</text>
    <text x="160" y="118" class="stat-value">4.22k lines</text>
    <text x="235" y="118" class="stat-size">110 kB</text>

    <circle cx="255" cy="113" r="4" fill="#ededed" stroke="#d1d5da" stroke-width="1" />
    <text x="267" y="118" class="lang">Go</text>
    <text x="395" y="118" class="stat-value">143 lines</text>
    <text x="465" y="118" class="stat-size">4.93 kB</text>

    <!-- 두 번째 줄 (Rust & JavaScript) -->
    <circle cx="20" cy="138" r="4" fill="#ededed" stroke="#d1d5da" stroke-width="1" />
    <text x="32" y="143" class="lang">Rust</text>
    <text x="160" y="143" class="stat-value">90 lines</text>
    <text x="235" y="143" class="stat-size">2.02 kB</text>

    <circle cx="255" cy="138" r="4" fill="#ededed" stroke="#d1d5da" stroke-width="1" />
    <text x="267" y="143" class="lang">JavaScript</text>
    <text x="395" y="143" class="stat-value">8 lines</text>
    <text x="465" y="143" class="stat-size">304 bytes</text>

</svg>
