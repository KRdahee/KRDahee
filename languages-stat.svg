<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
    <defs>
        <!-- 프로필 카드와 동일한 네온 효과 적용 -->
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <style>
        .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; }
        .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #ff8c42; }
        .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #a0a0a0; }
        .lang { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #ffb880; }
        .stat-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #FFFFFF; text-anchor: end; }
        .stat-size { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #a0a0a0; text-anchor: end; }
        
        /* 네온 터미널 패널 테마 스타일 */
        .card-bg { fill: #141110; stroke: #ff6a00; stroke-width: 1.5; }
    </style>

    <!-- 와이드 카드 배경 (픽셀 단위 크기 고정 및 네온 테두리 적용) -->
    <rect x="5" y="5" width="790" height="150" rx="10" class="card-bg" filter="url(#neon-glow)" />

    <!-- 제목 아이콘 및 텍스트 -->
    <g transform="translate(25, 20)">
        <path fill="#ff6a00" fill-rule="evenodd" d="M1.5 2.75a.25.25 0 01.25-.25h12.5a.25.25 0 01.25.25v8.5a.25.25 0 01-.25.25h-6.5a.75.75 0 00-.53.22L4.5 14.44v-2.19a.75.75 0 00-.75-.75h-2a.25.25 0 01-.25-.25v-8.5zM1.75 1A1.75 1.75 0 000 2.75v8.5C0 12.216.784 13 1.75 13H3v1.543a1.457 1.457 0 002.487 1.03L8.061 13h6.189A1.75 1.75 0 0016 11.25v-8.5A1.75 1.75 0 0014.25 1H1.75zm5.03 3.47a.75.75 0 010 1.06L5.31 7l1.47 1.47a.75.75 0 01-1.06 1.06l-2-2a.75.75 0 010-1.06l2-2a.75.75 0 011.06 0zm2.44 0a.75.75 0 000 1.06L10.69 7 9.22 8.47a.75.75 0 001.06 1.06l2-2a.75.75 0 000-1.06l-2-2a.75.75 0 00-1.06 0z"/>
    </g>
    <text x="50" y="33" class="title">16 Languages</text>

    <!-- 서브타이틀 및 설명 -->
    <text x="25" y="55" class="subtitle">Most used languages</text>
    <text x="25" y="73" class="desc">estimation from 370kb of code in 279 edited files across 86 commits</text>

    <!-- 언어 비율 프로그레스 바 -->
    <clipPath id="bar-clip">
        <rect x="25" y="85" width="750" height="8" rx="4" />
    </clipPath>
    <g clip-path="url(#bar-clip)">
        <rect x="25" y="85" width="750" height="8" fill="#222222" />
        <!-- TypeScript -->
        <rect x="25" y="85" width="703" height="8" fill="#ff6a00" />
        <!-- Rust -->
        <rect x="728" y="85" width="30" height="8" fill="#ffbd2e" />
        <!-- Go -->
        <rect x="758" y="85" width="13" height="8" fill="#27c93f" />
        <!-- JavaScript -->
        <rect x="771" y="85" width="4" height="8" fill="#ff5f56" />
    </g>

    <!-- 첫 번째 줄 (왼쪽: TypeScript / 오른쪽: Go) -->
    <circle cx="30" cy="113" r="4" fill="#ff6a00" />
    <text x="42" y="118" class="lang">TypeScript</text>
    <text x="280" y="118" class="stat-value">4.22k lines</text>
    <text x="375" y="118" class="stat-size">110 kB</text>

    <circle cx="430" cy="113" r="4" fill="#27c93f" />
    <text x="442" y="118" class="lang">Go</text>
    <text x="680" y="118" class="stat-value">143 lines</text>
    <text x="775" y="118" class="stat-size">4.93 kB</text>

    <!-- 두 번째 줄 (왼쪽: Rust / 오른쪽: JavaScript) -->
    <circle cx="30" cy="138" r="4" fill="#ffbd2e" />
    <text x="42" y="143" class="lang">Rust</text>
    <text x="280" y="143" class="stat-value">90 lines</text>
    <text x="375" y="143" class="stat-size">2.02 kB</text>

    <circle cx="430" cy="138" r="4" fill="#ff5f56" />
    <text x="442" y="143" class="lang">JavaScript</text>
    <text x="680" y="143" class="stat-value">8 lines</text>
    <text x="775" y="143" class="stat-size">304 bytes</text>

</svg>
